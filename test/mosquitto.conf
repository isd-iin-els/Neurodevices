# ==========================================
# Configuração Padrão do Mosquitto (MQTT + WS)
# ==========================================

# Permite conexões sem usuário e senha (ideal para testes/desenvolvimento)
allow_anonymous true

# Listener 1: Protocolo MQTT padrão (Porta TCP 1883 - ex: Python, ESP32, Arduino)
listener 1883
protocol mqtt

# Listener 2: Protocolo WebSockets (Porta WS 9001 - ex: Navegadores Web, HTML/JS)
listener 9001
protocol websockets